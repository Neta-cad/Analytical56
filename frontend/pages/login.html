<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Analytical</title>
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

  <header class="navbar">
    <a href="../index.html" class="logo">Analytical</a>
  </header>

  <section class="auth-wrapper">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Log in to keep building, practicing, and earning.</p>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="loginEmail" required>

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="loginPassword" required>

        <button type="submit" class="btn-filled btn-large" style="width:100%; margin-top: 20px;">Log In</button>
      </form>

      <p id="loginMessage" class="auth-message"></p>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
  </section>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
