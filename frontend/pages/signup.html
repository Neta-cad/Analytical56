<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Analytical</title>
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

  <header class="navbar">
    <a href="../index.html" class="logo">Analytical</a>
  </header>

  <section class="auth-wrapper">
    <div class="auth-card">
      <h2>Create your account</h2>
      <p class="auth-subtitle">Join tech people building, practicing, and earning together.</p>

      <form id="signupForm">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">

        <label for="track">Your Track</label>
        <select id="track" name="track" required>
          <option value="">Select a track</option>
          <option value="web-dev">Web Development</option>
          <option value="cybersecurity">Cybersecurity</option>
          <option value="data-science">Data Science</option>
          <option value="devops">DevOps</option>
          <option value="ai-ml">AI / ML</option>
          <option value="qa">QA & Testing</option>
        </select>

        <button type="submit" class="btn-filled btn-large" style="width:100%; margin-top: 20px;">Sign Up</button>
      </form>

      <p id="signupMessage" class="auth-message"></p>

      <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
    </div>
  </section>

  <script>
    const savedTrack = localStorage.getItem('preselectedTrack');
    if (savedTrack) {
      const trackSelect = document.getElementById('track');
      for (const option of trackSelect.options) {
        if (option.textContent.trim().toLowerCase() === savedTrack.toLowerCase()) {
          option.selected = true;
        }
      }
      localStorage.removeItem('preselectedTrack');
    }
  </script>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
